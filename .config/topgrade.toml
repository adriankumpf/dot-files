# Reference for everything settable here:
# https://github.com/topgrade-rs/topgrade/blob/main/config.example.toml

[misc]
disable = [
  "containers",
  "gem",
  "go",
  "mas",
  "pnpm",
  "ruby_gems",
  "system",
  "tlmgr",
]

no_retry = true
display_time = true
cleanup = true
skip_notify = true

[brew]
autoremove = true
